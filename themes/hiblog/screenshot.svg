<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img"
     aria-label="HiBlog teması önizlemesi">
    <rect width="1200" height="900" fill="#fcfcfc"/>

    <!-- Üst başlık -->
    <text x="72" y="58" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600"
          fill="#18181b" letter-spacing="-0.8">Hi, Günlük</text>
    <text x="72" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#86868f">
        Yazılım, tasarım ve dijital üretim üzerine notlar
    </text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52525b">
        <text x="806" y="62">Anasayfa</text>
        <text x="898" y="62">Yazılım</text>
        <text x="978" y="62">Tasarım</text>
        <text x="1066" y="62">Hakkında</text>
    </g>
    <circle cx="1152" cy="56" r="15" fill="#f4f4f5"/>
    <path d="M1157 56a5.5 5.5 0 1 1-6-5.5 4.4 4.4 0 0 0 6 5.5z" fill="#52525b"/>

    <line x1="0" y1="104" x2="1200" y2="104" stroke="#e8e8ea" stroke-width="1.5"/>

    <!-- Manşet -->
    <rect x="72" y="146" width="98" height="22" rx="11" fill="#f8f1f9"/>
    <text x="86" y="161" font-family="Helvetica, Arial, sans-serif" font-size="10.5"
          font-weight="600" fill="#95389e">ÖNE ÇIKAN</text>

    <text x="72" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#95389e"
          font-weight="500">Yazılım
        <tspan fill="#86868f" font-weight="400"> · 24 Temmuz 2026 · 6 dk okuma</tspan>
    </text>

    <text x="72" y="244" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600"
          fill="#18181b" letter-spacing="-1.5">Kendi içerik yönetim</text>
    <text x="72" y="288" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600"
          fill="#18181b" letter-spacing="-1.5">sistemini yazmak</text>

    <g fill="#52525b" opacity="0.5">
        <rect x="72" y="312" width="470" height="8" rx="4"/>
        <rect x="72" y="330" width="404" height="8" rx="4"/>
    </g>

    <rect x="72" y="360" width="126" height="34" rx="6" fill="#95389e"/>
    <text x="93" y="382" font-family="Helvetica, Arial, sans-serif" font-size="13"
          font-weight="500" fill="#ffffff">Yazıyı oku →</text>

    <!-- Manşet görseli -->
    <rect x="742" y="150" width="386" height="248" rx="6" fill="#95389e" fill-opacity="0.09"/>
    <text x="935" y="300" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="600"
          fill="#95389e" opacity="0.42" text-anchor="middle">K</text>

    <line x1="0" y1="440" x2="1200" y2="440" stroke="#e8e8ea" stroke-width="1.5"/>

    <!-- Bölüm başlığı -->
    <text x="72" y="492" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="550"
          fill="#18181b">Son yazılar</text>
    <text x="810" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#86868f"
          text-anchor="end">9 yazı</text>
    <line x1="72" y1="508" x2="810" y2="508" stroke="#e8e8ea" stroke-width="1.5"/>

    <!-- Kart 1 -->
    <text x="72" y="546" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb"
          font-weight="500">Tasarım
        <tspan fill="#86868f" font-weight="400"> · 21 Temmuz 2026 · 5 dk okuma</tspan>
    </text>
    <text x="72" y="580" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600"
          fill="#18181b" letter-spacing="-0.6">Okunabilir tipografi: gövde metni için</text>
    <text x="72" y="608" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600"
          fill="#18181b" letter-spacing="-0.6">on iki pratik karar</text>
    <g fill="#52525b" opacity="0.42">
        <rect x="72" y="626" width="480" height="7" rx="3.5"/>
        <rect x="72" y="642" width="418" height="7" rx="3.5"/>
    </g>
    <text x="72" y="678" font-family="Helvetica, Arial, sans-serif" font-size="12.5"
          font-weight="500" fill="#95389e">Devamını oku →</text>

    <rect x="658" y="532" width="152" height="114" rx="6" fill="#2563eb" fill-opacity="0.08"/>
    <text x="734" y="606" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600"
          fill="#2563eb" opacity="0.4" text-anchor="middle">O</text>

    <line x1="72" y1="708" x2="810" y2="708" stroke="#e8e8ea" stroke-width="1.5"/>

    <!-- Kart 2 -->
    <text x="72" y="746" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0d9488"
          font-weight="500">Rehber
        <tspan fill="#86868f" font-weight="400"> · 6 Temmuz 2026</tspan>
    </text>
    <text x="72" y="780" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600"
          fill="#18181b" letter-spacing="-0.6">Blok editörüyle içerik kurmak</text>
    <g fill="#52525b" opacity="0.42">
        <rect x="72" y="798" width="452" height="7" rx="3.5"/>
        <rect x="72" y="814" width="386" height="7" rx="3.5"/>
    </g>
    <rect x="658" y="732" width="152" height="114" rx="6" fill="#0d9488" fill-opacity="0.08"/>
    <text x="734" y="806" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600"
          fill="#0d9488" opacity="0.4" text-anchor="middle">B</text>

    <!-- Yan sütun -->
    <text x="884" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12"
          font-weight="600" fill="#18181b">Arama</text>
    <line x1="884" y1="502" x2="1128" y2="502" stroke="#e8e8ea" stroke-width="1.5"/>
    <rect x="884" y="516" width="200" height="34" rx="6" fill="#fcfcfc" stroke="#e8e8ea"/>
    <rect x="1090" y="516" width="38" height="34" rx="6" fill="#18181b"/>

    <text x="884" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12"
          font-weight="600" fill="#18181b">Son yazılar</text>
    <line x1="884" y1="612" x2="1128" y2="612" stroke="#e8e8ea" stroke-width="1.5"/>

    <g font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#95389e" opacity="0.6">
        <text x="884" y="638">01</text>
        <text x="884" y="682">02</text>
        <text x="884" y="726">03</text>
    </g>
    <g fill="#18181b" opacity="0.7">
        <rect x="910" y="630" width="212" height="7.5" rx="3.75"/>
        <rect x="910" y="645" width="148" height="7.5" rx="3.75"/>
        <rect x="910" y="674" width="196" height="7.5" rx="3.75"/>
        <rect x="910" y="689" width="164" height="7.5" rx="3.75"/>
        <rect x="910" y="718" width="216" height="7.5" rx="3.75"/>
        <rect x="910" y="733" width="128" height="7.5" rx="3.75"/>
    </g>

    <text x="884" y="792" font-family="Helvetica, Arial, sans-serif" font-size="12"
          font-weight="600" fill="#18181b">Kategoriler</text>
    <line x1="884" y1="804" x2="1128" y2="804" stroke="#e8e8ea" stroke-width="1.5"/>
    <circle cx="890" cy="826" r="3.5" fill="#95389e"/>
    <rect x="904" y="822" width="82" height="7.5" rx="3.75" fill="#52525b" opacity="0.48"/>
    <circle cx="890" cy="850" r="3.5" fill="#2563eb"/>
    <rect x="904" y="846" width="96" height="7.5" rx="3.75" fill="#52525b" opacity="0.48"/>
</svg>
